name: Daily timestamp append

on:
  schedule:
    - cron: '30 16 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  append-log:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Append Shanghai timestamp to log.txt
        shell: bash
        run: |
          set -e

          TIMESTAMP="$(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M:%S CST')"
          echo "$TIMESTAMP" >> log.txt

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add log.txt
          git commit -m "chore: daily log update $TIMESTAMP" || echo "No changes to commit"
          git push
